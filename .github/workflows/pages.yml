name: Validate and deploy PlayDeck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - name: Check first-party JavaScript syntax
        run: find assets games scripts -name '*.js' -o -name '*.mjs' | xargs -n 1 node --check
      - name: Check service worker syntax
        run: node --check sw.js && node --check precache.js
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html offline.html games.json manifest.webmanifest sw.js precache.js _site/
          cp -r assets games vendor _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
