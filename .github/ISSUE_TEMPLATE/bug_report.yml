name: Bug report
description: Report a problem with PlayDeck or a game.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PlayDeck. Please include enough detail for someone else to reproduce the problem.
  - type: input
    id: game
    attributes:
      label: Affected game or page
      description: For example, Snake, Wander, or the game library. Include the URL if possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the game library\n2. Launch Snake\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any error message. You can attach screenshots or a video here.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: PS4 browser, PS5 browser, Windows Chrome, iPhone Safari, etc.
    validations:
      required: true
  - type: dropdown
    id: controls
    attributes:
      label: Input method
      options:
        - Controller
        - Keyboard
        - Mouse or pointer
        - Touch
        - Multiple input methods
        - Other
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller model, if relevant
      placeholder: DualShock 4, DualSense, Xbox controller, etc.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Does it happen every time? Did it work before? Include browser console errors if available.
