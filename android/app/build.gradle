plugins { id 'com.android.application' }
android {
    namespace 'com.playdeck.mobile'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'com.playdeck.mobile'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
    // The preview APK uses Android's development signing identity.
    buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
}
tasks.register('syncWebAssets', Copy) {
    from('../..') {
        include 'index.html', 'games.json', 'assets/**', 'games/**', 'vendor/**'
        exclude 'games/template/**'
    }
    into 'src/main/assets'
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
